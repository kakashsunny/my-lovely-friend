<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#120c24" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Rounded Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow Behind Heart -->
  <path d="M32 49.5 C16 38.5 8 29.5 8 20 C8 12.8 13.8 7 21 7 C25.5 7 29.6 9.4 32 13 C34.4 9.4 38.5 7 43 7 C50.2 7 56 12.8 56 20 C56 29.5 48 38.5 32 49.5 Z" 
        fill="#ec4899" opacity="0.3" filter="url(#glow)" transform="scale(0.85) translate(5.6, 5)" />

  <!-- Main Radiant Heart -->
  <path d="M32 48.5 C17.5 38 10 29.5 10 20.5 C10 13.5 15.5 8 22.5 8 C26.7 8 30.5 10.2 32 13.8 C33.5 10.2 37.3 8 41.5 8 C48.5 8 54 13.5 54 20.5 C54 29.5 46.5 38 32 48.5 Z" 
        fill="url(#heartGrad)" filter="url(#glow)" />

  <!-- Inner Gloss Highlight -->
  <path d="M22.5 10.5 C17 10.5 12.5 15 12.5 20.5 C12.5 24 15 28.5 20 33 C18 29 17.5 24 18.5 20 C19.5 16 23 13 26 12 C24.8 11 23.6 10.5 22.5 10.5 Z" 
        fill="#ffffff" opacity="0.35" />

  <!-- Sparkling Star Top Right -->
  <path d="M49 8 C49 11.5 52 13 54.5 13 C52 13 49 14.5 49 18 C49 14.5 46 13 43.5 13 C46 13 49 11.5 49 8 Z" 
        fill="#ffffff" />
  <circle cx="49" cy="13" r="1.5" fill="#fbcfe8" />

  <!-- Tiny Sparkle Lower Left -->
  <path d="M12 40 C12 41.8 13.5 42.5 15 42.5 C13.5 42.5 12 43.2 12 45 C12 43.2 10.5 42.5 9 42.5 C10.5 42.5 12 41.8 12 40 Z" 
        fill="#f472b6" opacity="0.8" />
</svg>
